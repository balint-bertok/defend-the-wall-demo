<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defend The Wall</title>
    <script type="module" crossorigin src="/defend-the-wall-demo/assets/index-CipIHzV4.js"></script>
    <link rel="stylesheet" crossorigin href="/defend-the-wall-demo/assets/index-C2De2hP4.css">
  </head>
  <body>
    <div id="app">
      <div id="game">
        <div id="stage">
          <div id="stage-frame">
            <canvas id="game-canvas"></canvas>
            <div id="banner"></div>
            <div id="hud">
              <div id="hud-top">
                <div class="hud-top-side">
                  <div id="hud-stocks"></div>
                  <div id="hud-chain"></div>
                </div>
                <div id="hud-info">
                  <span id="hud-wave"></span>
                  <span id="hud-focus"></span>
                  <span id="hud-countdown"></span>
                  <span id="hud-time"></span>
                  <span id="hud-kills"></span>
                </div>
                <div class="hud-top-side hud-top-right">
                  <div id="hud-workers"></div>
                  <div id="hud-controls">
                    <button id="hud-mute" class="hud-control" type="button"></button>
                    <button id="hud-speed" class="hud-control" type="button"></button>
                    <div id="zoom-controls" class="hud-control"></div>
                  </div>
                </div>
              </div>
            </div>
            <div id="chain-modal" hidden></div>
            <div id="workers-modal" hidden></div>
            <div id="unlock-toast"></div>
            <div id="dogma-strip"></div>
            <div id="hotbar"></div>
            <div id="dogma-choice" hidden></div>
          </div>
        </div>
      </div>
      <div id="menu-screen"></div>
    </div>
  </body>
</html>
